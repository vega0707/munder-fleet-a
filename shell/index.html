<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Munder Fleet</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand-mark">Munder</span>
        <span class="brand-sub">Fleet</span>
      </div>
      <div id="auth-status" class="auth-status">…</div>
    </header>

    <main class="layout">
      <section id="login-panel" class="login-panel hidden">
        <h1>登录</h1>
        <p>Web / 远程访问需要鉴权（优先走 AionCore JWT）。本机 loopback 免登已冻结。</p>
        <form id="login-form">
          <label>用户名 <input name="username" value="owner" autocomplete="username" /></label>
          <label>密码 <input name="password" type="password" value="owner" autocomplete="current-password" /></label>
          <button type="submit">进入</button>
        </form>
      </section>

      <section id="app-panel" class="app-panel hidden">
        <div class="toolbar">
          <button id="btn-seed" type="button">新建演示任务</button>
          <button id="btn-claim" type="button">Claim 并干活</button>
          <button id="btn-refresh" type="button">刷新</button>
          <span id="core-health" class="core-pill">Core: …</span>
        </div>

        <div class="columns">
          <section class="pane">
            <h2>任务</h2>
            <ul id="task-list" class="list"></ul>
          </section>
          <section class="pane">
            <h2>待定</h2>
            <ul id="decision-list" class="list"></ul>
          </section>
        </div>
        <div class="columns">
          <section class="pane">
            <h2>Michael 收件箱</h2>
            <ul id="inbox-list" class="list"></ul>
          </section>
          <section class="pane">
            <h2>执行日志</h2>
            <ul id="log-list" class="list"></ul>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
